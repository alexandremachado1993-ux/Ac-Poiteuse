<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111D2D">
    <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
    <title>My Time Keeper</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/app-icon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="images/icon-192.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sign-in (shown alone) -->
    <section id="login" class="login-wrap" hidden></section>

    <!-- Application shell (after sign-in) -->
    <div id="shell" hidden>
        <aside class="sidebar" aria-label="Menu">
            <div class="brand"><img src="images/app-icon.svg" alt=""><div><span data-i18n="app.title">My Time Keeper</span><small data-i18n="app.tagline"></small></div></div>
            <!-- 4.7: state of the app and of the network (every profile) -->
            <div class="app-status" id="appStatus" aria-live="polite"></div>
            <nav class="side-nav" id="sideNav" data-i18n-aria-label="app.navigation"></nav>
            <div class="side-foot">
                <div class="side-company"><img src="images/logo.png" alt="Auxiliar Conservera"><span>Auxiliar Conservera</span></div>
                <div class="side-tools">
                    <select class="language-select" id="languageSelect" data-i18n-aria-label="app.language"></select>
                </div>
            </div>
        </aside>

        <div class="main">
            <!-- 4.1.3: computer header — notifications and user menu, on the line of the page title (no breadcrumb) -->
            <header class="deskbar">
                <div class="deskbar-tools">
                    <button type="button" class="icon-button bell" id="notifButton"></button>
                    <div class="user-menu">
                        <button type="button" class="user-chip" id="userMenuButton" aria-haspopup="true" aria-expanded="false" aria-controls="userPop">
                            <span class="side-user" id="sideUser"></span><svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <div class="user-pop" id="userPop" hidden>
                            <a href="#settings/profile" id="userProfileLink"></a>
                            <button type="button" class="button" id="themeButton"></button>
                            <button type="button" class="button" id="signOutButton"></button>
                        </div>
                    </div>
                </div>
            </header>
            <header class="topbar">
                <img src="images/app-icon.svg" alt="">
                <span class="title" data-i18n="app.title">My Time Keeper</span>
                <div class="tools">
                    <span id="connectionState" class="app-status compact" aria-live="polite"></span>
                    <button type="button" class="icon-button notif-mobile" id="notifButtonMobile"></button>
                    <select class="language-select" id="languageSelectMobile" data-i18n-aria-label="app.language"></select>
                    <a class="icon-button" id="settingsMobile" href="#settings" data-i18n-aria-label="nav.settings"></a>
                    <button type="button" class="icon-button" id="signOutMobile" data-i18n-aria-label="common.signOut"></button>
                </div>
            </header>

            <main class="content">
                <div id="alerts" aria-live="polite"></div>
                <section id="page-dashboard" class="page" hidden></section>
                <section id="page-clock" class="page" hidden></section>
                <section id="page-leave" class="page" hidden></section>
                <section id="page-validation" class="page" hidden></section>
                <section id="page-team" class="page" hidden></section>
                <section id="page-reports" class="page" hidden></section>
                <section id="page-settings" class="page" hidden></section>
            </main>
        </div>

        <nav class="bottom-nav" id="bottomNav" data-i18n-aria-label="app.navigation"></nav>
    </div>

    <dialog id="editor" class="editor"></dialog>
    <dialog id="sheet" class="sheet"></dialog>
    <dialog id="night" class="night" aria-labelledby="nightTitle"></dialog>
    <div id="toast" aria-live="polite"></div>

    <script src="js/storage-adapter.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/holidays.js"></script>
    <script src="js/store.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/quick-unlock.js"></script>
    <script src="js/hours.js"></script>
    <script src="js/segments.js"></script>
    <script src="js/leave.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/explanations.js"></script>
    <script src="js/xlsx.js"></script>
    <script src="js/hours-csv.js"></script>
    <script src="js/xlsx-reader.js"></script>
    <script src="js/register-import.js"></script>
    <script src="js/exports.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/reminders.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/welcome.js"></script>
    <script src="js/page-login.js"></script>
    <script src="js/page-timesheet.js"></script>
    <script src="js/page-clock.js"></script>
    <script src="js/page-dashboard.js"></script>
    <script src="js/page-leave.js"></script>
    <script src="js/page-clients.js"></script>
    <script src="js/page-profile.js"></script>
    <script src="js/page-team.js"></script>
    <script src="js/report-doc.js"></script>
    <script src="js/page-reports.js"></script>
    <script src="js/page-clockings.js"></script>
    <script src="js/page-admin-panels.js"></script>
    <script src="js/page-weeks.js"></script>
    <script src="js/page-settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
